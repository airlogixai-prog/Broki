<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Oca del Pedal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="logo-container">
                <img src="la_oca_cover.png" alt="La Oca del Pedal" class="game-logo">
            </div>
            <p class="subtitle">¡Prepárate para beber!</p>

            <div class="player-input-area">
                <input type="text" id="new-player-name" placeholder="Nombre del jugador" maxlength="10">
                <div class="color-picker">
                    <button class="color-btn selected" style="background-color: #FF5252;" data-color="#FF5252"></button>
                    <button class="color-btn" style="background-color: #448AFF;" data-color="#448AFF"></button>
                    <button class="color-btn" style="background-color: #69F0AE;" data-color="#69F0AE"></button>
                    <button class="color-btn" style="background-color: #E040FB;" data-color="#E040FB"></button>
                    <button class="color-btn" style="background-color: #FFD740;" data-color="#FFD740"></button>
                    <button class="color-btn" style="background-color: #FF6E40;" data-color="#FF6E40"></button>
                </div>
                <button id="add-player-btn" class="btn primary">Añadir Jugador</button>
            </div>

            <ul id="players-list-preview">
                <!-- Players loop here -->
            </ul>

            <button id="start-game-btn" class="btn success big-btn" disabled>COMENZAR LA FIESTA</button>
        </div>

        <!-- Game Board Screen -->
        <div id="game-screen" class="screen">
            <header>
                <div class="host-avatar-container">
                    <img src="host_avatar.png" id="host-avatar" alt="Host">
                </div>
                <div class="turn-indicator">
                    <span>Turno de:</span>
                    <strong id="current-player-name">---</strong>
                </div>
            </header>

            <div class="board-container centered-board">
                <div id="game-board">
                    <!-- Squares generated by JS -->
                </div>
            </div>

            <div class="controls-area">
                <div class="dice-container">
                    <div id="dice" class="dice">
                        <div class="face front">1</div>
                        <div class="face back">6</div>
                        <div class="face right">3</div>
                        <div class="face left">4</div>
                        <div class="face top">5</div>
                        <div class="face bottom">2</div>
                    </div>
                </div>
                <button id="roll-btn" class="btn action">🎲 TIRAR 🎲</button>
            </div>
        </div>

    </div>

    <!-- Rule Modal -->
    <div id="rule-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal-x" onclick="forceCloseRuleModal()">&times;</span>
            <div class="modal-header">
                <h2 id="modal-title">Título de la Casilla</h2>
            </div>
            <div class="modal-body">
                <div id="modal-icon" class="modal-emoji">🍺</div>
                <p id="modal-desc">Descripción de la regla...</p>
                <div id="modal-action-area"></div>
            </div>
            <div class="modal-footer">
                <button id="modal-ok-btn" class="btn primary">¡Entendido!</button>
            </div>
        </div>
    </div>

    <!-- Roulette Modal -->
    <div id="roulette-modal" class="modal">
        <div class="modal-content roulette-content">
            <span class="close-modal-x"
                onclick="document.getElementById('roulette-modal').classList.remove('show'); if(typeof nextTurn === 'function') nextTurn();"
                style="position: absolute; right: 20px; top: 15px; font-size: 2rem; cursor: pointer; color: #fff;">&times;</span>
            <h2 class="roulette-title">🎰 MODO LOCO 🎰</h2>
            <h3 id="roulette-player-name" class="roulette-subtitle">Turno de ...</h3>

            <div class="roulette-container">
                <div class="wheel-pointer"></div>
                <div id="roulette-wheel" class="wheel">
                    <!-- Sections will be CSS conic gradients or divs -->
                    <div class="wheel-text t1">1</div>
                    <div class="wheel-text t2">2</div>
                    <div class="wheel-text t3">3</div>
                    <div class="wheel-text t4">4</div>
                </div>
            </div>

            <p id="roulette-result-text" class="status-text">¡Toca girar!</p>
            <button id="spin-btn" class="btn action">🔥 GIRAR 🔥</button>
        </div>
    </div>

    <!-- Winner Overlay -->
    <div id="winner-overlay" class="overlay">
        <div class="winner-content">
            <h1>👑 ¡GANADOR! 👑</h1>
            <h2 id="winner-name">Nombre</h2>
            <p>¡Todo el mundo brinda por el campeón!</p>
            <button onclick="location.reload()" class="btn primary">Jugar otra vez</button>
        </div>
    </div>

    <script src="confetti.js"></script>
    <script src="script.js"></script>
</body>

</html>
