                                        <p className="text-blue-50">Almacenamiento inteligente y escalable</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="space-y-6">
                                <div className="group relative overflow-hidden bg-gradient-to-br from-purple-500 to-violet-600 text-white p-8 rounded-3xl shadow-2xl hover:scale-105 transition-all duration-300">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16"></div>
                                    <div className="relative z-10">
                                        <Icon name="bar-chart-3" className="w-12 h-12 mb-4" />
                                        <h3 className="font-black text-2xl mb-3">Decisiones Datos</h3>
                                        <p className="text-purple-50">Análisis completo para mejora continua</p>
                                    </div>
                                </div>
                                
                                <div className="group relative overflow-hidden bg-gradient-to-br from-orange-500 to-red-600 text-white p-8 rounded-3xl shadow-2xl hover:scale-105 transition-all duration-300">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16"></div>
                                    <div className="relative z-10">
                                        <Icon name="message-square" className="w-12 h-12 mb-4" />
                                        <h3 className="font-black text-2xl mb-3">Comunicación</h3>
                                        <p className="text-orange-50">Inmediata y efectiva 24/7</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )
                },
                {
                    type: 'cover',
                    content: (
                        <div className="h-full relative overflow-hidden bg-gradient-to-br from-slate-900 via-indigo-900 to-purple-900">
                            <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48cGF0dGVybiBpZD0iZ3JpZCIgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNIDQwIDAgTCAwIDAgMCA0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMDUpIiBzdHJva2Utd2lkdGg9IjEiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjZ3JpZCkiLz48L3N2Zz4=')] opacity-30"></div>
                            
                            <div className="relative h-full flex flex-col items-center justify-center p-12 z-10">
                                <div className="bg-gradient-to-r from-emerald-500 via-cyan-400 to-blue-500 p-1 rounded-3xl mb-8 animate-pulse">
                                    <div className="bg-slate-900 rounded-3xl p-8">
                                        <Icon name="check-circle" className="w-24 h-24 text-emerald-400" />
                                    </div>
                                </div>
                                
                                <h1 className="text-7xl font-black mb-6 text-center">
                                    <span className="bg-gradient-to-r from-emerald-400 via-cyan-400 to-blue-400 bg-clip-text text-transparent">
                                        ¿Listo para Optimizar?
                                    </span>
                                </h1>
                                
                                <div className="flex items-center justify-center gap-4 mb-8">
                                    <div className="h-1 w-24 bg-gradient-to-r from-transparent via-cyan-400 to-cyan-400 rounded"></div>
                                    <Icon name="sparkles" className="w-8 h-8 text-cyan-400 animate-pulse" />
                                    <div className="h-1 w-24 bg-gradient-to-l from-transparent via-cyan-400 to-cyan-400 rounded"></div>
                                </div>
                                
                                <div className="text-center space-y-4">
                                    <p className="text-4xl font-bold text-white mb-2">AIRLOGIX AI</p>
                                    <p className="text-2xl text-cyan-300 font-medium">Transformando el MRO del futuro</p>
                                </div>
                                
                                <div className="mt-12 inline-block bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl px-10 py-5">
                                    <p className="text-xl text-white font-semibold">Contáctanos para comenzar</p>
                                </div>
                            </div>
                            
                            <div className="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-emerald-600/30 to-transparent"></div>
                        </div>
                    )
                }
            ];

            useEffect(() => {
                if (icons) {
                    lucide.createIcons();
                }
            }, [currentSlide, icons]);

            const nextSlide = () => {
                setCurrentSlide((prev) => (prev + 1) % slides.length);
            };

            const prevSlide = () => {
                setCurrentSlide((prev) => (prev - 1 + slides.length) % slides.length);
            };

            const currentSlideData = slides[currentSlide];

            return (
                <div className="w-full h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex flex-col">
                    <div className="flex-1 bg-white shadow-2xl m-6 rounded-3xl overflow-hidden relative">
                        {currentSlideData.type === 'cover' ? (
                            currentSlideData.content
                        ) : (
                            <div className="h-full flex flex-col p-12 bg-gradient-to-br from-gray-50 to-white">
                                <div className="mb-8">
                                    <h2 className="text-5xl font-black text-gray-900 mb-2 bg-gradient-to-r from-blue-600 to-cyan-600 bg-clip-text text-transparent">
                                        {currentSlideData.title}
                                    </h2>
                                    {currentSlideData.subtitle && (
                                        <p className="text-xl text-gray-500 font-semibold">{currentSlideData.subtitle}</p>
                                    )}
                                    <div className="h-1.5 w-24 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-full mt-3"></div>
                                </div>
                                <div className="flex-1 overflow-auto">
                                    {currentSlideData.content}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 text-white p-5 flex items-center justify-between shadow-2xl">
                        <button
                            onClick={prevSlide}
                            className="flex items-center space-x-2 px-8 py-3 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 rounded-xl transition-all duration-300 font-semibold shadow-lg hover:shadow-xl hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100"
                            disabled={currentSlide === 0}
                        >
                            <Icon name="chevron-left" className="w-5 h-5" />
                            <span>Anterior</span>
                        </button>

                        <div className="flex items-center space-x-6">
                            <span className="text-lg font-bold bg-white/10 backdrop-blur-sm px-4 py-2 rounded-lg border border-white/20">
                                {currentSlide + 1} / {slides.length}
                            </span>
                            <div className="flex space-x-2">
                                {slides.map((_, index) => (
                                    <button
                                        key={index}
                                        onClick={() => setCurrentSlide(index)}
                                        className={`transition-all duration-300 rounded-full ${
                                            index === currentSlide 
                                                ? 'w-8 h-3 bg-gradient-to-r from-cyan-400 to-blue-500' 
                                                : 'w-3 h-3 bg-gray-500 hover:bg-gray-400'
                                        }`}
                                    />
                                ))}
                            </div>
                        </div>

                        <button
                            onClick={nextSlide}
                            className="flex items-center space-x-2 px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 rounded-xl transition-all duration-300 font-semibold shadow-lg hover:shadow-xl hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100"
                            disabled={currentSlide === slides.length - 1}
                        >
                            <span>Siguiente</span>
                            <Icon name="chevron-right" className="w-5 h-5" />
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<Presentation />, document.getElementById('root'));
    </script>
</body>
</html>
